workflows:
  chinafast-entregador-android:
    name: ChinaFast Entregador Android

    max_build_duration: 120

    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17

      vars:
        PACKAGE_NAME: "com.chinafast.entregador"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Verificar ambiente
        script: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "Diretório do projeto:"
          pwd

          echo "Arquivos:"
          ls -la

      - name: Instalar dependências
        script: |
          npm ci || npm install

      - name: Verificar projeto Expo
        script: |
          npx expo-doctor || true

      - name: Gerar projeto Android
        script: |
          rm -rf android
          npx expo prebuild --platform android --non-interactive

      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Dar permissão ao Gradle
        script: |
          chmod +x android/gradlew

      - name: Criar APK release
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - $HOME/.gradle/daemon/**/daemon-*.out.log

    publishing:
      email:
        recipients:
          - tradetatui@gmail.com
        notify:
          success: true
          failure: true
